<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Choose Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <style>
      :root{--card-bg:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));--accent:#73e944;--btn-text:#0b0d10}
      html,body{height:100%}
      body{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg,#0B0D10);font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
      .chooser{width:min(680px,94vw);text-align:center;color:var(--muted,#cbd5e1);padding:28px;border-radius:12px;background:var(--card-bg);box-shadow:0 8px 40px rgba(2,6,23,0.6);backdrop-filter:blur(6px)}
      .chooser h1{margin:0 0 6px;color:var(--text,#fff);letter-spacing:-0.2px;font-weight:600}
      .chooser p{margin:0 0 18px;color:var(--secondary,#9aa6b2)}
      .options{display:flex;gap:14px;justify-content:center;margin-top:18px}
      .store-card{flex:1;min-width:160px;background:rgba(255,255,255,0.02);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-decoration:none;color:inherit;border:1px solid transparent;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
      .store-card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(3,10,28,0.6);border-color:rgba(255,255,255,0.04)}
      .store-logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ffb84d);display:flex;align-items:center;justify-content:center;color:var(--btn-text);font-weight:700;margin-bottom:12px}
      .store-name{font-weight:700;margin-bottom:6px}
      .store-sub{font-size:13px;color:var(--secondary,#9aa6b2)}
      .store-cta{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--accent);color:var(--btn-text);font-weight:600;text-decoration:none}
      .store-cta.secondary{background:linear-gradient(180deg,#1e293b,#0b1220);color:#fff;border:1px solid rgba(255,255,255,0.04)}
      @media (max-width:640px){.options{flex-direction:column}.store-card{width:100%}}
    </style>
  </head>
  <body>
    <main class="chooser">
      <h1>Choose a Store</h1>
      <p>Select which storefront you want to open.</p>
      <div class="options">
        <a class="store-card" href="aitbaha.html" aria-label="Open Ait Baha store">
          <div class="store-logo">AB</div>
          <div>
            <div class="store-name">Ait Baha Store</div>
            <div class="store-sub">Open the Ait Baha Inventory</div>
          </div>
          <div class="store-cta">Open</div>
        </a>

        <a class="store-card" href="Oued-dahab.html" aria-label="Open Oued Dahab store">
          <div class="store-logo">OD</div>
          <div>
            <div class="store-name">Oued Dahab Store</div>
            <div class="store-sub">Open the Oued Dahab Inventory</div>
          </div>
          <div class="store-cta">Open</div>
        </a>
      </div>
    </main>
  </body>
</html>
